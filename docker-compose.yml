services:
  results:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mt-f1chronos-results:latest
    container_name: f1chronos-results
    expose:
      - "8080"
    environment:
      RESULTS_DATA: /data
      RESULTS_ADMIN_PASSWORD: ${RESULTS_ADMIN_PASSWORD:-}
      RESULTS_SECRET: ${RESULTS_SECRET:-change-me-in-production}
    volumes:
      - results-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: f1chronos-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env
    environment:
      # Fail fast si le domaine n'est pas configuré (sinon Caddy sert localhost → ERR_SSL_*).
      RESULTS_DOMAIN: ${RESULTS_DOMAIN:?Définis RESULTS_DOMAIN dans .env (ex. simracing-dc.yseddiki.fr)}
      CADDY_EMAIL: ${CADDY_EMAIL:?Définis CADDY_EMAIL dans .env (contact Let's Encrypt)}
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      results:
        condition: service_healthy
    restart: unless-stopped

volumes:
  results-data:
  caddy-data:
  caddy-config:
