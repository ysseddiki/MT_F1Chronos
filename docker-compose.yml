services:
  results:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mt-f1chronos-results:latest
    container_name: f1chronos-results
    expose:
      - "8080"
    environment:
      RESULTS_DATA: /data
      RESULTS_ADMIN_PASSWORD: ${RESULTS_ADMIN_PASSWORD:-}
      RESULTS_SECRET: ${RESULTS_SECRET:-change-me-in-production}
    volumes:
      - results-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: f1chronos-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RESULTS_DOMAIN: ${RESULTS_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - results
    restart: unless-stopped

volumes:
  results-data:
  caddy-data:
  caddy-config:
