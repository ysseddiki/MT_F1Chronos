services:
  results:
    build:
      context: ./server
      dockerfile: Dockerfile
      # Réseau hôte pendant pip install : évite les timeouts PyPI sur petits VPS
      # (docker compose build n’a pas de flag --network sur toutes les versions).
      network: host
    image: mt-f1chronos-results:latest
    container_name: f1chronos-results
    expose:
      - "8080"
    environment:
      RESULTS_DATA: /data
      RESULTS_ADMIN_PASSWORD: ${RESULTS_ADMIN_PASSWORD:-}
      RESULTS_SECRET: ${RESULTS_SECRET:-change-me-in-production}
      RESULTS_DOMAIN: ${RESULTS_DOMAIN:-}
      # letsencrypt | custom | internal | http — voir .env.example
      RESULTS_TLS_MODE: ${RESULTS_TLS_MODE:-letsencrypt}
      RESULTS_SECURE_COOKIES: ${RESULTS_SECURE_COOKIES:-}
    volumes:
      - results-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: f1chronos-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env
    environment:
      RESULTS_DOMAIN: ${RESULTS_DOMAIN:?Définis RESULTS_DOMAIN dans .env}
      RESULTS_TLS_MODE: ${RESULTS_TLS_MODE:-letsencrypt}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./server/caddy/${RESULTS_TLS_MODE:-letsencrypt}.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${RESULTS_TLS_CERT_DIR:-./certs}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      results:
        condition: service_healthy
    restart: unless-stopped

volumes:
  results-data:
  caddy-data:
  caddy-config:
