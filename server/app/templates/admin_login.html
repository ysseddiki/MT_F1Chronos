{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block body %}
<p class="kicker">ADMINISTRATION</p>
<h1>Connexion</h1>
{% if error %}<p class="danger">{{ error }}</p>{% endif %}
<form method="post">
    <div class="field">
        <label for="password">Mot de passe serveur</label>
        <input id="password" name="password" type="password" autocomplete="current-password"/>
    </div>
    <button type="submit" class="primary">Entrer</button>
</form>
{% endblock %}
